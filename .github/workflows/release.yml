name: Release

on:
  push:
    tags:
      - 'RELEASE.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name for the release (e.g., RELEASE.2026-03-19T17-00-00Z)'
        required: true
        type: string

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Build Console binary (Linux amd64)
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags "-s -w" -o console-linux-amd64 ./cmd/console/

      - name: Build Console binary (Linux arm64)
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: arm64
        run: go build -trimpath -ldflags "-s -w" -o console-linux-arm64 ./cmd/console/

      - name: Build Console binary (macOS amd64)
        env:
          CGO_ENABLED: 0
          GOOS: darwin
          GOARCH: amd64
        run: go build -trimpath -ldflags "-s -w" -o console-darwin-amd64 ./cmd/console/

      - name: Build Console binary (macOS arm64)
        env:
          CGO_ENABLED: 0
          GOOS: darwin
          GOARCH: arm64
        run: go build -trimpath -ldflags "-s -w" -o console-darwin-arm64 ./cmd/console/

      - name: Build Console binary (Windows amd64)
        env:
          CGO_ENABLED: 0
          GOOS: windows
          GOARCH: amd64
        run: go build -trimpath -ldflags "-s -w" -o console-windows-amd64.exe ./cmd/console/

      - name: Get tag name
        id: get_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Generate Release Notes
        run: |
          cat > release_notes.md << 'EOF'
          ## Console Release ${{ steps.get_tag.outputs.TAG }}

          ### Features
          - Event tag index UI with rebuild support
          - Admin tag index management
          - Full admin console with user/group/policy management

          ### Binaries
          | Platform | File |
          |----------|------|
          | Linux amd64 | `console-linux-amd64` |
          | Linux arm64 | `console-linux-arm64` |
          | macOS amd64 | `console-darwin-amd64` |
          | macOS arm64 (Apple Silicon) | `console-darwin-arm64` |
          | Windows amd64 | `console-windows-amd64.exe` |
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_tag.outputs.TAG }}
          name: Console ${{ steps.get_tag.outputs.TAG }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            console-linux-amd64
            console-linux-arm64
            console-darwin-amd64
            console-darwin-arm64
            console-windows-amd64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
